{% extends "public/base.html" %}
{% block title %}About Us{% endblock %}
{% block content %}
  <section class="block on-paper">
    <div class="container">
      <h1>About us</h1>
      {% if about_us %}
        {% if about_us.image_url %}
          <div class="detail-image" style="max-width:480px;">
            <img src="{{ about_us.image_url }}" alt="About Us">
          </div>
        {% endif %}
        <div>{{ about_us.content }}</div>
      {% endif %}
    </div>
  </section>
{% endblock %}
