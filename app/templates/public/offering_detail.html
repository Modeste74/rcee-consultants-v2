{% extends "public/base.html" %}
{% block title %}{{ offering.name }}{% endblock %}
{% block content %}
  <div class="container">
    <div class="detail-header">
      <span class="offering-type">{{ offering.type.value | capitalize }}</span>
      <h1>{{ offering.name }}</h1>
    </div>
    {% if offering.image_url %}
      <div class="detail-image">
        <img src="{{ offering.image_url }}" alt="{{ offering.name }}">
      </div>
    {% endif %}
    <p>{{ offering.description }}</p>
    <a class="btn" href="{{ url_for('public.contact') }}?offering={{ offering.id }}">Enquire about this</a>
  </div>
{% endblock %}
