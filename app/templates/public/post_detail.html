{% extends "public/base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
  <div class="container">
    <div class="detail-header">
      <h1>{{ post.title }}</h1>
    </div>
    {% if post.image_url %}
      <div class="detail-image">
        <img src="{{ post.image_url }}" alt="{{ post.title }}">
      </div>
    {% endif %}
    <div>{{ post.content }}</div>
  </div>
{% endblock %}
