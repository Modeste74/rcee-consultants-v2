{% extends "admin/base.html" %}
{% from "_macros.html" import field %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <h1>Reset Password</h1>
  <form method="POST">
    {{ form.hidden_tag() }}
    {{ field(form.password) }}
    {{ field(form.confirm_password) }}
    {{ form.submit() }}
  </form>
{% endblock %}
