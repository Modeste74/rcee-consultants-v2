{% extends "admin/base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <h1>Reset Password</h1>
  <form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.password.label }} {{ form.password() }}</p>
    <p>{{ form.confirm_password.label }} {{ form.confirm_password() }}</p>
    {{ form.submit() }}
  </form>
{% endblock %}
