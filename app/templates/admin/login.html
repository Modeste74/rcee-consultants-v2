{% extends "admin/base.html" %}
{% from "_macros.html" import field %}
{% block title %}Log In{% endblock %}
{% block content %}
  <h1>Admin Login</h1>
  <form method="POST">
    {{ form.hidden_tag() }}
    {{ field(form.username) }}
    {{ field(form.password) }}
    {{ form.submit() }}
  </form>
  <a href="{{ url_for('admin.forgot_password') }}">Forgot password?</a>
{% endblock %}
